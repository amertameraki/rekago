<style>
:root {
  --bg:      #FDFAF3;
  --nav:     #403919;
  --gold:    #F2BB16;
  --amber:   #BF9E3B;
  --warn:    #A6600A;
  --ok:      #5C8A1A;
  --danger:  #C0392B;
  --surface: #FFFFFF;
  --border:  rgba(191,158,59,0.2);
  --text:    #403919;
  --muted:   rgba(64,57,25,0.5);
  --ch-tokopedia: #E05E1E;
  --ch-shopee:    #D0001B;
  --ch-tiktok:    #1DAB52;
  --ch-direct:    #1A6A9A;
  --radius: 8px;
  --shadow: 0 1px 4px rgba(64,57,25,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--bg); color: var(--text); line-height: 1.5; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 13px; }

/* NAV */
nav { background: var(--nav); display: flex; align-items: center; padding: 0 24px; height: 48px; gap: 32px; position: sticky; top: 0; z-index: 100; }
.nav-brand { display: flex; flex-direction: column; line-height: 1.1; min-width: 110px; }
.nav-brand-name { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--gold); letter-spacing: -0.3px; }
.nav-brand-sub { font-size: 9px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(242,187,22,0.45); }
.nav-tabs { display: flex; gap: 2px; flex: 1; justify-content: center; }
.nav-tab { background: none; border: none; color: rgba(242,187,22,0.55); font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 6px; transition: color 0.15s, background 0.15s; white-space: nowrap; }
.nav-tab:hover { color: var(--gold); background: rgba(242,187,22,0.07); }
.nav-tab.active { color: var(--nav); background: var(--gold); font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 10px; min-width: 220px; justify-content: flex-end; position: relative; }
.lang-btn { background: none; border: none; color: rgba(242,187,22,0.5); font-size: 11px; font-weight: 600; padding: 3px 6px; border-radius: 4px; transition: color 0.15s; }
.lang-btn:hover, .lang-btn.active { color: var(--gold); }
.language-note { position: absolute; top: 48px; right: 110px; width: 220px; padding: 10px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 18px rgba(64,57,25,0.16); font-size: 11px; line-height: 1.45; opacity: 0; transform: translateY(-5px); pointer-events: none; transition: all 0.2s ease; z-index: 20; }
.language-note.show { opacity: 1; transform: translateY(0); }
.language-note::before { content: ''; position: absolute; top: -6px; right: 82px; width: 10px; height: 10px; background: var(--surface); border-left: 1px solid var(--border); border-top: 1px solid var(--border); transform: rotate(45deg); }
.demo-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: var(--warn); background: rgba(166,96,10,0.12); padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
.btn-reset-sandbox { background:none; border:1px solid rgba(242,187,22,0.28); border-radius:6px; color:rgba(242,187,22,0.72); font-size:11px; font-weight:600; padding:5px 10px; white-space:nowrap; }
.btn-reset-sandbox:hover { border-color:var(--gold); color:var(--gold); }
.btn-trylive { background: var(--gold); color: var(--nav); border: none; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 6px; transition: opacity 0.15s; text-decoration: none; white-space: nowrap; }
.btn-trylive:hover { opacity: 0.88; }
.live-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ok); font-weight: 600; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* LAYOUT */
#app { display: flex; flex-direction: column; min-height: 100vh; }
#page-frame { flex: 1; }

/* SPLASH */
#splash {
  position: fixed; inset: 0; z-index: 500;
  background: #403919;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  transition: opacity 0.5s ease;
}
#splashWord {
  font-family: 'DM Serif Display', serif; font-size: 56px; color: #F2BB16;
  letter-spacing: -1px; opacity: 0; transform: translateY(10px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
#splashSub {
  font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(242,187,22,0.4); opacity: 0;
  transition: opacity 0.5s ease 0.4s;
}
#splashTag {
  font-size: 13px; color: rgba(242,187,22,0.55); margin-top: 4px; opacity: 0;
  transition: opacity 0.5s ease 0.65s;
}

/* TOUR */
#tourBox {
  display: none; position: fixed; z-index: 401;
  background: #403919; color: #FDFAF3;
  border: 1px solid rgba(242,187,22,0.25); border-radius: 10px;
  padding: 14px 18px; width: 260px;
  box-shadow: 0 4px 24px rgba(64,57,25,0.3);
}
#tourArrow {
  position: absolute; width: 10px; height: 10px; background: #403919;
  transform: rotate(45deg);
}

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(64,57,25,0.45); z-index: 200; align-items: center; justify-content: center; }

.modal { background: var(--surface); border-radius: 12px; padding: 32px; width: 400px; box-shadow: 0 8px 40px rgba(64,57,25,0.18); }
.modal-brand { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--gold); margin-bottom: 6px; }
.modal-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
.modal-label { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; display: block; }
.modal-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; background: var(--bg); color: var(--text); outline: none; transition: border 0.15s; }
.modal-input:focus { border-color: var(--amber); }
.modal-error { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-modal-primary { flex: 1; background: var(--gold); color: var(--nav); border: none; font-size: 13px; font-weight: 700; padding: 11px; border-radius: 8px; transition: opacity 0.15s; }
.btn-modal-primary:hover { opacity: 0.88; }
.btn-modal-secondary { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 11px 18px; border-radius: 8px; }
.modal-note { font-size: 11px; color: var(--muted); margin-top: 16px; line-height: 1.5; text-align: center; }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--nav); color: var(--gold); font-size: 13px; font-weight: 500; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(64,57,25,0.2); z-index: 300; transform: translateY(80px); opacity: 0; transition: all 0.25s ease; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: var(--danger); color: #fff; }

/* DESKTOP-ONLY NOTICE */
#desktop-notice { display: none; }

@media (max-width: 1023px) {
  body { min-height: 100%; overflow: hidden; }
  #splash, #tourBox, #app, .modal-overlay, .toast { display: none !important; }
  #desktop-notice {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;

    align-items: center;

    height: 62px;

  .desktop-notice-brand {
    margin-bottom: 14px;
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--amber);
  }
  .desktop-notice-title {
    margin-bottom: 12px;
    font-family: 'DM Serif Display', serif;
    font-size: clamp(30px, 8vw, 38px);
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: -0.5px;
    color: var(--nav);

  .desktop-notice-copy {
    max-width: 330px;
    margin: 0 auto;
    font-size: 14px;
    line-height: 1.7;
    color: var(--muted);
  }
  .desktop-notice-rule {
    width: 42px;
    height: 3px;
    margin: 24px auto 18px;
    border: 0;
    border-radius: 999px;
    background: var(--gold);
  }
  .desktop-notice-foot {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--amber);
  }
}
</style>

// ============================================================
// PAGE LOADER
// ============================================================
const PAGE_CACHE = {};
const PAGE_SCRIPTS_LOADED = {};
let pageLoadSequence = 0;

async function loadPage(name) {
  const loadSequence = ++pageLoadSequence;
  // Update nav active state
  if (typeof event !== 'undefined' && event && event.currentTarget) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    event.currentTarget.classList.add('active');
  } else {
    document.querySelectorAll('.nav-tab').forEach(t => {
      t.classList.toggle('active', !!(t.getAttribute('onclick') && t.getAttribute('onclick').includes("'" + name + "'")));
    });
  }
  if (!PAGE_CACHE[name]) {
    const res        = await fetch(name + '.html');
    PAGE_CACHE[name] = await res.text();
  }
  if (loadSequence !== pageLoadSequence) return;
  const frame = document.getElementById('page-frame');
  frame.innerHTML = PAGE_CACHE[name];
  if (!PAGE_SCRIPTS_LOADED[name]) {
    for (const oldScript of frame.querySelectorAll('script')) {
      if (loadSequence !== pageLoadSequence) return;
      const script = document.createElement('script');
      [...oldScript.attributes].forEach(attr => script.setAttribute(attr.name, attr.value));
      script.textContent = oldScript.textContent;
      // A single failed/blocked script (e.g. a third-party tag some host
      // injects into the HTML response — Vercel's preview-feedback widget
      // does this even to fragments fetched via fetch(), and CSP then
      // blocks it) must not abort the rest of this page's init — that
      // would silently skip init_<name>() and leave the page blank.
      const loaded = script.src
        ? new Promise(resolve => { script.onload = resolve; script.onerror = resolve; })
        : Promise.resolve();
      oldScript.replaceWith(script);
      await loaded;
      if (loadSequence !== pageLoadSequence) return;
    }
    PAGE_SCRIPTS_LOADED[name] = true;
  }
  if (loadSequence !== pageLoadSequence) return;
  if (typeof window['init_' + name] === 'function') window['init_' + name]();
}

// ============================================================
// LANGUAGE
// ============================================================
function setLang(lang) {
  if (lang !== 'en') {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.lang-btn[onclick="setLang(\'en\')"]').classList.add('active');
    REKAGO.lang = 'en';
    showLanguageNote(lang);
    return;
  }
  REKAGO.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  if (typeof window.onLangChange === 'function') window.onLangChange(lang);
}
function showLanguageNote(lang) {
  const note = document.getElementById('languageNote');
  if (!note) return;
  const label = lang === 'id' ? 'Indonesian' : 'Korean';
  note.textContent = `${label} language support is coming soon. English remains active for now.`;
  note.classList.add('show');
  clearTimeout(window.languageNoteTimer);
  window.languageNoteTimer = setTimeout(() => note.classList.remove('show'), 3600);
}

// ============================================================
// SANDBOX DATA
// ============================================================
// The public build intentionally has no backend transport. Refreshing the page
// reconstructs these arrays from the fixed seed.
function resetSandboxState() {
  REKAGO.skus        = SANDBOX_SEED.skus.map(row => ({ ...row }));
  REKAGO.items       = SANDBOX_SEED.items.map(row => ({ ...row }));
  REKAGO.packingLists = SANDBOX_SEED.packingLists.map(list => ({
    ...list,
    lines: list.lines.map(line => ({ ...line })),
  }));
  REKAGO.stockIn     = SANDBOX_SEED.stockIn.map(row => ({ ...row }));
  REKAGO.stockOut    = SANDBOX_SEED.stockOut.map(row => ({ ...row }));
  REKAGO.openingStock = { ...SANDBOX_SEED.openingStock };
}

function confirmSandboxReset() {
  const confirmed = window.confirm(
    'Reset the Sandbox? All changes, imported data, and unfinished drafts in this browser session will be discarded.'
  );
  if (confirmed) window.location.reload();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ============================================================
// HELPERS
// ============================================================
function hasLiveData() {
  return true;
}
function requireEditable() {
  return true;
}
// Kept for page compatibility; all public forms are editable.
function lockDemoWriteForm() {}

// Applies a stock delta and recomputes the sample SKU status in memory.
function applySandboxStockDelta(skuId, delta) {
  const sku = REKAGO.skus.find(s => s['SKU ID'] === skuId);
  if (!sku) return;
  const current   = Number(sku['Current Stock']) || 0;
  const reorder   = Number(sku['Reorder Threshold']) || 0;
  const newStock  = Math.max(0, current + delta);
  sku['Current Stock'] = newStock;
  sku['SKU Status'] = newStock === 0 ? 'Out of Stock' : newStock <= reorder ? 'Low Stock' : 'In Stock';
}
function formatRp(val) { return 'Rp ' + Number(val).toLocaleString('id-ID'); }
// Escapes a value before it's interpolated into an .innerHTML template.
// Sandbox forms and imported session data are untrusted and must never be
// rendered as executable HTML.
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}
function channelPill(ch) {
  const cls = ch === 'Tokopedia' ? 'ch-tokopedia' : ch === 'Shopee' ? 'ch-shopee' : ch === 'TikTok Shop' ? 'ch-tiktok' : 'ch-direct';
  return `<span class="channel-pill ${cls}">${escapeHtml(ch)}</span>`;
}
function statusPill(s) {
  const cls = ['In Stock', 'Fulfilled', 'Received', 'Available'].includes(s)
    ? 'in-stock'
    : ['Low Stock', 'Pending', 'Draft', 'In Transit', 'Staged'].includes(s)
      ? 'low-stock'
      : 'out';
  return `<span class="status-pill ${cls}">${escapeHtml(s)}</span>`;
}

// ============================================================
// SPLASH
// ============================================================
function runSplash() {
  const splash = document.getElementById('splash');

  // Trigger CSS transitions — use double rAF to ensure paint first
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('splashWord').style.opacity   = '1';
    document.getElementById('splashWord').style.transform = 'translateY(0)';
    document.getElementById('splashSub').style.opacity    = '1';
    document.getElementById('splashTag').style.opacity    = '1';
  }));

  // After 2s — fade out and load dashboard
  setTimeout(async () => {
    splash.style.opacity        = '0';
    splash.style.pointerEvents  = 'none';
    await loadPage('dashboard');
    // Wait for fade-out to finish, then remove splash and start tour
    setTimeout(() => {
      splash.style.display = 'none';
      maybeStartTour();
    }, 500);
  }, 2000);
}

// ============================================================
// TOOLTIP TOUR
// ============================================================
const TOUR_KEY = 'rekago_tour_done';
const TOUR_STEPS = [
  {
    title:  'Dashboard',
    body:   'Your inventory at a glance — SKU counts, low stock alerts, and revenue vs orders. Sandbox changes update this view immediately.',
    target: () => document.querySelector('.nav-tab[onclick*="dashboard"]'),
    pos:    'below',
  },
  {
    title:  'SKU Overview',
    body:   'Each row is one product family. The bar shows stock level — orange means below reorder threshold.',
    target: () => document.getElementById('skuTableBody')?.closest('.card'),
    pos:    'right',
  },
  {
    title:  'Revenue & Orders',
    body:   'Bars track revenue (Rp), the line tracks order count. Toggle between Week and Month view.',
    target: () => document.querySelector('.period-btn'),
    pos:    'below',
  },
  {
    title:  'Products',
    body:   'Add SKUs, set categories and channels, track cost vs unit price per product.',
    target: () => document.querySelector('.nav-tab[onclick*="products"]'),
    pos:    'below',
  },
  {
    title:  'Stock In & Outbound',
    body:   'Record inbound deliveries and group sales, consignment transfers, or other stock movements under one outbound number.',
    target: () => document.querySelector('.nav-tab[onclick*="stockin"]'),
    pos:    'below',
  },
  {
    title:  'Get Your Own Version',
    body:   'Need an inventory workflow tailored to your business? Connect with us to discuss a customized implementation.',
    target: () => document.getElementById('consultCta'),
    pos:    'below-left',
  },
];

let tourIndex = 0;

function maybeStartTour() {
  if (localStorage.getItem(TOUR_KEY)) return;
  tourIndex = 0;
  // Small delay so dashboard renders fully before we measure element positions
  setTimeout(showTourStep, 300);
}

function showTourStep() {
  const step   = TOUR_STEPS[tourIndex];
  const target = step.target();
  const box    = document.getElementById('tourBox');
  const arrow  = document.getElementById('tourArrow');

  if (!target) { tourNext(); return; }

  document.getElementById('tourStep').textContent  = (tourIndex + 1) + ' of ' + TOUR_STEPS.length;
  document.getElementById('tourTitle').textContent = step.title;
  document.getElementById('tourBody').textContent  = step.body;
  document.getElementById('tourNextBtn').textContent = tourIndex === TOUR_STEPS.length - 1 ? 'Done' : 'Next';

  document.getElementById('tourDots').innerHTML = TOUR_STEPS.map((_, i) =>
    `<div style="width:6px;height:6px;border-radius:50%;background:${i === tourIndex ? '#F2BB16' : 'rgba(242,187,22,0.2)'}"></div>`
  ).join('');

  box.style.display = 'block';

  const r   = target.getBoundingClientRect();
  const bw  = 260;
  const bh  = box.offsetHeight || 160;
  const gap = 12;
  let top, left;

  // Reset arrow styles
  arrow.style.cssText = 'position:absolute;width:10px;height:10px;background:#403919;transform:rotate(45deg);';

  if (step.pos === 'below' || step.pos === 'below-left') {
    top  = r.bottom + gap;
    left = step.pos === 'below-left'
         ? Math.min(r.right - bw, window.innerWidth - bw - 16)
         : r.left;
    left = Math.max(8, left);
    const arrowLeft = Math.min(r.left + r.width / 2 - left - 5, bw - 20);
    arrow.style.top         = '-6px';
    arrow.style.left        = arrowLeft + 'px';
    arrow.style.borderLeft  = '1px solid rgba(242,187,22,0.25)';
    arrow.style.borderTop   = '1px solid rgba(242,187,22,0.25)';
  } else if (step.pos === 'right') {
    top  = r.top + r.height / 2 - bh / 2;
    left = r.right + gap;
    if (left + bw > window.innerWidth - 8) left = r.left - bw - gap;
    arrow.style.top          = (bh / 2 - 5) + 'px';
    arrow.style.left         = '-6px';
    arrow.style.transform    = 'rotate(-45deg)';
    arrow.style.borderLeft   = '1px solid rgba(242,187,22,0.25)';
    arrow.style.borderBottom = '1px solid rgba(242,187,22,0.25)';
  }

  top = Math.max(60, Math.min(top, window.innerHeight - bh - 16));
  box.style.top  = top  + 'px';
  box.style.left = left + 'px';

  // Highlight
  target.style.outline       = '2px solid #F2BB16';
  target.style.outlineOffset = '3px';
  target.style.borderRadius  = '4px';
  target._tourHighlighted    = true;
}

function clearHighlight() {
  TOUR_STEPS.forEach(s => {
    const t = s.target ? s.target() : null;
    if (t && t._tourHighlighted) {
      t.style.outline = ''; t.style.outlineOffset = '';
      t._tourHighlighted = false;
    }
  });
}

function tourNext() {
  clearHighlight();
  tourIndex++;
  if (tourIndex >= TOUR_STEPS.length) skipTour();
  else showTourStep();
}

function skipTour() {
  clearHighlight();
  document.getElementById('tourBox').style.display = 'none';
  localStorage.setItem(TOUR_KEY, '1');
}

// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  resetSandboxState();
  document.head.insertAdjacentHTML('beforeend', SHARED_CSS);
  runSplash();
});
